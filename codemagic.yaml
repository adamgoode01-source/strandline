# Codemagic CI/CD - builds Strandline for iOS on a macOS machine and ships to TestFlight.
#
# Before the first run, one thing must exist in the Codemagic UI (it cannot live here):
#   Team settings > Integrations > Apple Developer Portal -> add your App Store Connect
#   API key (Issuer ID, Key ID, .p8 file). The name given to that key must match
#   the `app_store_connect:` value under `integrations` below, exactly.
#   Currently set to: PT Elongation App Manager
#
# Docs: https://docs.codemagic.io/yaml-quick-start/building-a-native-ios-app/

workflows:
  ios-testflight:
    name: Strandline iOS - TestFlight
    instance_type: mac_mini_m2
    max_build_duration: 45

    integrations:
      # This must match the integration name in Codemagic EXACTLY, character for
      # character. Find it at: Teams > (your team) > Integrations > Developer
      # Portal > Manage keys - it is the "Name" column, which is the name given
      # to the App Store Connect API key when it was added to Codemagic.
      app_store_connect: PT Elongation App Manager

    environment:
      vars:
        BUNDLE_ID: "com.jcconcrete.strandline"
        XCODE_PROJECT: "ios/App/App.xcodeproj"
        XCODE_SCHEME: "App"
      node: 24
      xcode: latest

    cache:
      cache_paths:
        - ~/.npm

    scripts:
      - name: Install npm dependencies
        script: npm ci

      - name: Sync web assets into the iOS project
        script: npx cap sync ios

      - name: Set the build number
        script: |
          cd "$CM_BUILD_DIR/ios/App"
          # Codemagic's per-project counter guarantees a build number App Store
          # Connect has not seen before, which it rejects duplicates of.
          agvtool new-version -all "$(($BUILD_NUMBER + 1))"

      - name: Show what Apple actually has for this account
        script: |
          # Diagnostic. Whatever this prints is the truth about the account -
          # if the bundle id is absent or spelled differently, it shows here.
          echo "--- bundle ids visible to this API key ---"
          app-store-connect list-bundle-ids --json || true
          echo "--- distribution certificates ---"
          app-store-connect list-certificates --type IOS_DISTRIBUTION --json || true

      - name: Fetch or create signing files
        script: |
          keychain initialize
          # --create makes the provisioning profile (and a distribution
          # certificate) when none exists yet, which is the normal state for a
          # brand new App ID. Plain automatic signing only fetches.
          app-store-connect fetch-signing-files "$BUNDLE_ID" --type IOS_APP_STORE --create
          keychain add-certificates
          xcode-project use-profiles

      - name: Build the ipa
        script: |
          xcode-project build-ipa \
            --project "$CM_BUILD_DIR/$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME" \
            --config Release

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.app

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        submit_to_app_store: false
        # Once the internal tester group exists in App Store Connect, uncomment
        # this and the build will be handed to it automatically. The name must
        # match the group exactly. Until then the build simply lands in
        # TestFlight and you assign it by hand.
        # beta_groups:
        #   - JC Concrete Field

      email:
        recipients:
          - agoode@jcconcretellc.com
        notify:
          success: true
          failure: true
